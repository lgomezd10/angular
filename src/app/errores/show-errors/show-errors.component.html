@if (withoutConexion) {
  <p-message severity="warn" icon="pi pi-spin pi-spinner">
    Conectando con el servidor
  </p-message>
}

@if (typeError=='Errors') {
  @if (erroresValue) {
    <p-message severity="error">
      {{erroresValue}}
    </p-message>
  }
}
@if (typeError=='Error404') {
  @if (errores404Value) {
    <p-message severity="info">
      {{errores404Value}}
    </p-message>
  }
}
