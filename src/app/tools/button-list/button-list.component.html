<div class="w-full">
    <ul>
      @for (button of buttonList$ | async; track button) {
        @if (button.show) {
          <li>
            <p-button styleClass="w-full" severity="success" id="{{button.id}}" (click)="onSend(button.id)"
            #listButton (keydown)="processKeydown($event, button.id)">{{button.name}}</p-button>
          </li>
        }
      }
    </ul>
</div>
