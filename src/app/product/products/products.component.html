<div class="max-w-4xl mx-auto p-4">
  <h2 class="text-2xl font-bold mb-6">Productos</h2>
  <app-button-list [lista]="buttons" (sendButtonType)="showButtonType($event)"></app-button-list>

  <app-show-errors [typeError]="'Error404'"></app-show-errors>
 
  <app-new [display]="showNewProduct" (savedProduct)="endNewProduct($event)"></app-new>
  

  <div class="flex flex-col md:flex-row w-full gap-6">
    
    <div class="flex-1 order-2 md:order-1">
      <div class="flex gap-2 mb-4">
        <input pInputText id="search" type="text" [(ngModel)]="searchText" placeholder="Buscar producto"
          class="w-full mb-2" />
      </div>

      @if (updatedProduct.show) {
      <p-message severity="success">Se ha actualizado el producto: {{updatedProduct.product.name}}</p-message>
      }
      <p-table [value]="products | sort:'name' | filter: searchText" dataKey="id" class="mb-4">
        <ng-template pTemplate="header">
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Nombre</th>
            <th scope="col">Stock</th>
            <th scope="col">Precio</th>
            <th scope="col">Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-product>
          <tr>
            <td>{{product.id}}</td>
            <td>
              <input pInputText type="text" [(ngModel)]="product.name" class="w-full" />
            </td>
            <td>{{product.stock}}</td>
            <td>
              <input pInputText type="number" [(ngModel)]="product.price" class="w-24" />
            </td>
            <td class="flex gap-2">
              <p-button (onClick)="saveProduct(product)" icon="pi pi-check" severity="success"
                size="small"></p-button>
              <a [title]="product.name + ' details'" [routerLink]="['/product', product.id]">
                <p-button icon="pi pi-info-circle" size="small" severity="info"></p-button>
              </a>
            </td>
          </tr>
        </ng-template>
      </p-table>
      
    </div>
  </div>
</div>
